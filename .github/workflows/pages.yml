name: Publish learning website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: local-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - name: Verify PostgreSQL scoring and per-user access
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: local-test-only
        run: |
          psql -v ON_ERROR_STOP=1 -f test/auth-bootstrap.sql
          psql -v ON_ERROR_STOP=1 -f supabase/schema.sql
          psql -v ON_ERROR_STOP=1 -f supabase/schema.sql
          psql -v ON_ERROR_STOP=1 -f test/database.sql
          psql -v ON_ERROR_STOP=1 -f supabase/games.sql
          psql -v ON_ERROR_STOP=1 -f supabase/games.sql
          psql -v ON_ERROR_STOP=1 -f test/games-database.sql
      - name: Prepare static website
        run: |
          mkdir -p dist
          cp index.html app.js oauth.js art.js pali-script.js pairing.js grammar.js game-engine.js game-ui.js style.css config.js lessons.js favicon.svg dist/
          cp -r assets dist/assets
          touch dist/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
